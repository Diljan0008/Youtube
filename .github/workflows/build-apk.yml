name: Automatic YouTube Premium Logo Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Reassemble Split APK Parts
        run: |
          cat apk_part_* > youtube_orig.apk
          rm -f apk_part_*

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Latest Apktool
        run: |
          mkdir -p ~/.local/bin
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O ~/.local/bin/apktool
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O ~/.local/bin/apktool.jar
          chmod +x ~/.local/bin/apktool ~/.local/bin/apktool.jar
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Decompile YouTube APK (Bypassing XML Errors)
        run: |
          apktool d -r youtube_orig.apk -o youtube_out

      - name: Auto Swap EVERY SINGLE LOGO For Premium Header
        run: |
          BASE_DIR=$(pwd)
          
          echo "========================================================="
          echo "🚀 STARTING LOGO SWAPPING PROCESS WITH LIVE LOGS"
          echo "========================================================="
          
          find youtube_out -type d -name "drawable-*" | while read -r dir; do
            # ਸਿਰਫ ਓਹੀ ਫੋਲਡਰ ਸਕ੍ਰੀਨ ਤੇ ਦਿਖਾਉਣੇ ਜਿੱਥੇ ਕੰਮ ਹੋ ਰਿਹਾ ਹੈ
            MATCH_FOUND=false
            
            # 1. ਪੁਰਾਣੇ ਟੈਕਸਟ ਵਾਲੇ ਲੋਗੋ ਬਦਲੋ
            if [ -f "$dir/yt_logo_text_dark.png" ]; then
              rm -f "$dir/yt_logo_text_dark.png" && cp "$BASE_DIR/yt_premium_logo_text_dark.png" "$dir/yt_logo_text_dark.png"
              echo "✅ CHANGED: [yt_logo_text_dark.png] in path: $dir"
            fi
            if [ -f "$dir/yt_logo_text_light.png" ]; then
              rm -f "$dir/yt_logo_text_light.png" && cp "$BASE_DIR/yt_premium_logo_text_light.png" "$dir/yt_logo_text_light.png"
              echo "✅ CHANGED: [yt_logo_text_light.png] in path: $dir"
            fi
            
            # 2. ਨਵੇਂ PNG Wordmark Headers ਨੂੰ ਬਦਲੋ
            if [ -f "$dir/yt_wordmark_header_dark.png" ]; then
              rm -f "$dir/yt_wordmark_header_dark.png" && cp "$BASE_DIR/yt_premium_logo_text_dark.png" "$dir/yt_wordmark_header_dark.png"
              echo "✅ CHANGED: [yt_wordmark_header_dark.png] in path: $dir"
            fi
            if [ -f "$dir/yt_wordmark_header_light.png" ]; then
              rm -f "$dir/yt_wordmark_header_light.png" && cp "$BASE_DIR/yt_premium_logo_text_light.png" "$dir/yt_wordmark_header_light.png"
              echo "✅ CHANGED: [yt_wordmark_header_light.png] in path: $dir"
            fi
            
            # 3. ਨਵੇਂ WEBP Ringo2 Wordmark Headers ਨੂੰ ਬਦਲੋ
            if [ -f "$dir/yt_ringo2_wordmark_header_dark.webp" ]; then
              rm -f "$dir/yt_ringo2_wordmark_header_dark.webp" && cp "$BASE_DIR/yt_premium_logo_text_dark.png" "$dir/yt_ringo2_wordmark_header_dark.webp"
              echo "✅ CHANGED: [yt_ringo2_wordmark_header_dark.webp] in path: $dir"
            fi
            if [ -f "$dir/yt_ringo2_wordmark_header_light.webp" ]; then
              rm -f "$dir/yt_ringo2_wordmark_header_light.webp" && cp "$BASE_DIR/yt_premium_logo_text_light.png" "$dir/yt_ringo2_wordmark_header_light.webp"
              echo "✅ CHANGED: [yt_ringo2_wordmark_header_light.webp] in path: $dir"
            fi
            
            # 4. ਬਾਕੀ ਬਚੇ ਆਮ youtube_logo ਵਾਲੇ ਬੈਕਅੱਪ ਵੀ ਸਾਫ਼ ਕਰੋ
            if [ -f "$dir/youtube_logo.webp" ]; then
              rm -f "$dir/youtube_logo.webp" && cp "$BASE_DIR/yt_premium_logo_text_dark.png" "$dir/youtube_logo.webp"
              echo "✅ CHANGED: [youtube_logo.webp] in path: $dir"
            fi
            if [ -f "$dir/ic_youtube_logo.png" ]; then
              rm -f "$dir/ic_youtube_logo.png" && cp "$BASE_DIR/yt_premium_logo_text_dark.png" "$dir/ic_youtube_logo.png"
              echo "✅ CHANGED: [ic_youtube_logo.png] in path: $dir"
            fi
            
          done
          
          echo "========================================================="
          echo "🎉 LOGO SWAPPING FINISHED SUCCESSFULLY!"
          echo "========================================================="

      - name: Recompile Modified Code Into APK
        run: |
          apktool b youtube_out -o youtube_unsigned.apk

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Generate Keystore & Sign Final APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias youtube_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass "mysecretpassword" -keypass "mysecretpassword" -dname "CN=Diljan, OU=Dev, O=Mod, L=IN, S=PB, C=IN"
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 youtube_unsigned.apk youtube_aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:"mysecretpassword" --out youtube_premium_mod.apk youtube_aligned.apk

      - name: Upload Final Signed APK File
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Premium-Logo-APK
          path: youtube_premium_mod.apk
