name: Automatic YouTube Premium Logo Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Reassemble Split APK Parts
        run: |
          cat apk_part_* > youtube_orig.apk
          rm -f apk_part_*

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Latest Apktool & ZIP Tools
        run: |
          mkdir -p ~/.local/bin
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O ~/.local/bin/apktool
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O ~/.local/bin/apktool.jar
          chmod +x ~/.local/bin/apktool ~/.local/bin/apktool.jar
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          sudo apt-get update && sudo apt-get install -y zip

      - name: Decompile YouTube APK
        run: |
          apktool d -r youtube_orig.apk -o youtube_out

      - name: Recompile Code Into APK (First Build)
        run: |
          apktool b youtube_out -o youtube_unsigned.apk

      - name: Direct Zip Injection (Replacing Logos inside Compiled APK)
        run: |
          BASE_DIR=$(pwd)
          
          echo "========================================================="
          echo "🚀 INJECTING PREMIUM LOGOS DIRECTLY INTO COMPILED APK"
          echo "========================================================="
          
          # ਪਹਿਲਾਂ ਚੈੱਕ ਕਰਨਾ ਕਿ ਤੁਹਾਡੀ ਰੈਪੋ 'ਚ ਅਸਲੀ ਫਾਈਲਾਂ ਕਿਹੜੀਆਂ ਪਈਆਂ ਨੇ
          echo "📁 Checking files in repository root:"
          ls -la
          
          # ਜੇ ਫਾਈਲਾਂ ਦਾ ਨਾਮ ਥੋੜ੍ਹਾ ਬਦਲਵਾਂ ਹੈ ਤਾਂ ਆਪੇ ਸਹੀ ਫਾਈਲ ਸੈੱਟ ਕਰਨਾ
          DARK_SRC=$(find . -maxdepth 1 -name "*premium*dark*.png" -o -name "*premium*dark*.webp" | head -n 1)
          LIGHT_SRC=$(find . -maxdepth 1 -name "*premium*light*.png" -o -name "*premium*light*.webp" | head -n 1)
          
          # ਜੇਕਰ ਉੱਪਰਲੇ ਨਾਮ ਨਾ ਮਿਲੇ ਤਾਂ ਕੋਈ ਵੀ premium ਨਾਮ ਵਾਲੀ ਫਾਈਲ ਚੁੱਕ ਲੈਣਾ
          if [ -z "$DARK_SRC" ]; then DARK_SRC=$(find . -maxdepth 1 -name "*premium*.png" | head -n 1); fi
          if [ -z "$LIGHT_SRC" ]; then LIGHT_SRC=$(find . -maxdepth 1 -name "*premium*.png" | tail -n 1); fi
          
          # ਜੇ ਫਿਰ ਵੀ ਕੁਝ ਨਾ ਮਿਲੇ (ਯਾਨੀ ਫਾਈਲ ਅਪਲੋਡ ਹੀ ਨਹੀਂ ਕੀਤੀ)
          if [ -z "$DARK_SRC" ] || [ ! -f "$DARK_SRC" ]; then
            echo "❌ ERROR: ਰੈਪੋ ਵਿੱਚ ਕੋਈ ਵੀ ਪ੍ਰੀਮੀਅਮ ਲੋਗੋ (premium_logo) ਇਮੇਜ ਨਹੀਂ ਮਿਲੀ! ਕਿਰਪਾ ਕਰਕੇ ਪਹਿਲਾਂ ਫਾਈਲ ਅਪਲੋਡ ਕਰੋ।"
            exit 1
          fi
          
          echo "🎯 Using Dark Logo Source: $DARK_SRC"
          echo "🎯 Using Light Logo Source: $LIGHT_SRC"
          
          # ਟੈਂਪਰੇਰੀ ਫੋਲਡਰ ਸਟ੍ਰਕਚਰ ਤਿਆਰ ਕਰਨਾ
          mkdir -p zip_injection/res
          mkdir -p zip_injection/resources/res
          
          prepare_logos() {
            local root_path=$1
            for size in "mdpi" "hdpi" "xhdpi" "xxhdpi" "xxxhdpi"; do
              local target_dir="$root_path/drawable-$size"
              mkdir -p "$target_dir"
              
              cp "$BASE_DIR/$DARK_SRC" "$target_dir/yt_logo_text_dark.png"
              cp "$BASE_DIR/$LIGHT_SRC" "$target_dir/yt_logo_text_light.png"
              cp "$BASE_DIR/$DARK_SRC" "$target_dir/yt_wordmark_header_dark.png"
              cp "$BASE_DIR/$LIGHT_SRC" "$target_dir/yt_wordmark_header_light.png"
              cp "$BASE_DIR/$DARK_SRC" "$target_dir/yt_ringo2_wordmark_header_dark.webp"
              cp "$BASE_DIR/$LIGHT_SRC" "$target_dir/yt_ringo2_wordmark_header_light.webp"
              cp "$BASE_DIR/$DARK_SRC" "$target_dir/youtube_logo.webp"
              cp "$BASE_DIR/$DARK_SRC" "$target_dir/ic_youtube_logo.png"
            done
          }
          
          prepare_logos "zip_injection/res"
          prepare_logos "zip_injection/resources/res"
          
          # ਏ.ਪੀ.ਕੇ ਦੇ ਅੰਦਰ ਇੰਜੈਕਟ ਕਰਨਾ
          cd zip_injection
          zip -ur "$BASE_DIR/youtube_unsigned.apk" res/ resources/
          cd "$BASE_DIR"
          
          rm -rf zip_injection
          echo "✅ INJECTION INTO ZIP/APK COMPLETED!"
          echo "========================================================="

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Generate Keystore & Sign Final APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias youtube_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass "mysecretpassword" -keypass "mysecretpassword" -dname "CN=Diljan, OU=Dev, O=Mod, L=IN, S=PB, C=IN"
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 youtube_unsigned.apk youtube_aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:"mysecretpassword" --out youtube_premium_mod.apk youtube_aligned.apk

      - name: Upload Final Signed APK File
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Premium-Logo-APK
          path: youtube_premium_mod.apk
