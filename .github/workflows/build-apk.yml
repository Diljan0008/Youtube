name: Automatic YouTube Premium Logo Builder (JADX Edition)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Reassemble Split APK Parts
        run: |
          cat apk_part_* > youtube_orig.apk
          rm -f apk_part_*

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install JADX & ZIP Tools
        run: |
          # JADX ਦਾ ਲੇਟੈਸਟ ਵਰਜ਼ਨ ਡਾਊਨਲੋਡ ਕਰਨਾ
          cd $HOME
          wget https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          mkdir jadx_dir && unzip -q jadx-1.5.1.zip -d jadx_dir
          echo "$HOME/jadx_dir/bin" >> $GITHUB_PATH
          sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Decompile Resources using JADX
        run: |
          echo "========================================================="
          echo "🚀 DECOMPILING RESOURCES WITH JADX (NO XML ERRORS)"
          echo "========================================================="
          # JADX ਰਾਹੀਂ ਸਿਰਫ਼ ਰਿਸੋਰਸਿਜ਼ ਅਤੇ ਇਮੇਜਿਜ਼ ਬਾਹਰ ਕੱਢਣੀਆਂ
          jadx youtube_orig.apk --only-resources -d jadx_out

      - name: Fully Automated Smart Logo Swap via JADX Output
        run: |
          BASE_DIR=$(pwd)
          echo "========================================================="
          echo "🔍 AUTO-DETECTING INTERNAL PREMIUM LOGOS"
          echo "========================================================="
          
          # JADX ਦੇ ਆਊਟਪੁੱਟ ਵਿੱਚੋਂ ਅਸਲੀ ਪ੍ਰੀਮੀਅਮ ਲੋਗੋ ਲੱਭਣਾ
          INT_PREMIUM_DARK=$(find jadx_out -type f -name "*premium*wordmark*dark*" -o -name "*premium*logo*dark*" | head -n 1)
          INT_PREMIUM_LIGHT=$(find jadx_out -type f -name "*premium*wordmark*light*" -o -name "*premium*logo*light*" | head -n 1)
          
          if [ -z "$INT_PREMIUM_DARK" ] || [ -z "$INT_PREMIUM_LIGHT" ]; then
            echo "❌ ERROR: JADX ਨੂੰ ਵੀ ਐਪ ਦੇ ਅੰਦਰੋਂ ਪ੍ਰੀਮੀਅਮ ਲੋਗੋ ਨਹੀਂ ਲੱਭਿਆ!"
            exit 1
          fi
          
          echo "🎯 JADX Found Dark Premium Source: $INT_PREMIUM_DARK"
          echo "🎯 JADX Found Light Premium Source: $INT_PREMIUM_LIGHT"
          
          # ਬੈਕਅੱਪ ਰੱਖਣਾ
          cp "$INT_PREMIUM_DARK" premium_dark_auto.png
          cp "$INT_PREMIUM_LIGHT" premium_light_auto.png
          
          echo "========================================================="
          echo "🔄 AUTO-SWAPPING ALL REGULAR LOGOS IN JADX RESOURCES"
          echo "========================================================="
          
          # ਹੁਣ ਜਿੱਥੇ ਵੀ ਆਮ ਲੋਗੋ ਪਏ ਨੇ, ਉਹਨਾਂ ਨੂੰ ਆਪੇ ਲੱਭ ਕੇ ਬਦਲਣਾ
          find jadx_out -type f \( -name "*wordmark*header*" -o -name "*logo_text*" -o -name "*youtube_logo*" \) | grep -v "premium" | while read -r normal_logo; do
            if [[ "$normal_logo" == *"dark"* ]]; then
              rm -f "$normal_logo" && cp premium_dark_auto.png "$normal_logo"
              echo "  ✅ REPLACED (DARK): $normal_logo"
            elif [[ "$normal_logo" == *"light"* ]]; then
              rm -f "$normal_logo" && cp premium_light_auto.png "$normal_logo"
              echo "  ✅ REPLACED (LIGHT): $normal_logo"
            else
              rm -f "$normal_logo" && cp premium_dark_auto.png "$normal_logo"
              echo "  ✅ REPLACED (GENERAL): $normal_logo"
            fi
          done

      - name: Inject Modified Logos Directly Back into Original APK
        run: |
          BASE_DIR=$(pwd)
          echo "========================================================="
          echo "📦 INJECTING MODIFIED LOGOS VIA ZIP INTO ORIGINAL APK"
          echo "========================================================="
          
          # ਇੱਕ ਸਾਫ਼ ਫੋਲਡਰ ਬਣਾ ਕੇ ਸਿਰਫ਼ ਬਦਲੀਆਂ ਹੋਈਆਂ ਫੋਟੋਆਂ ਦਾ ਸਟ੍ਰਕਚਰ ਤਿਆਰ ਕਰਨਾ
          mkdir -p zip_repack
          
          # JADX ਦੇ ਰਿਸੋਰਸ ਫੋਲਡਰ (res) ਨੂੰ ਚੁੱਕਣਾ
          if [ -d "jadx_out/resources/res" ]; then
            cp -r jadx_out/resources/res zip_repack/
          elif [ -d "jadx_out/res" ]; then
            cp -r jadx_out/res zip_repack/
          fi
          
          # ਸਿਰਫ਼ drawable ਫੋਲਡਰ ਰੱਖਣੇ, ਬਾਕੀ ਫਾਲਤੂ XML/Layouts ਡਿਲੀਟ ਕਰ ਦੇਣੇ ਤਾਂ ਜੋ ਏ.ਪੀ.ਕੇ ਖਰਾਬ ਨਾ ਹੋਵੇ
          find zip_repack -type f ! \( -name "*wordmark*header*" -o -name "*logo_text*" -o -name "*youtube_logo*" \) -delete 2>/dev/null || true
          
          # ਮੇਨ ਏ.ਪੀ.ਕੇ ਦੀ ਇੱਕ ਕਾਪੀ ਬਣਾਉਣੀ ਜਿਸਨੂੰ ਆਪਾਂ ਅਪਡੇਟ ਕਰਨਾ ਹੈ
          cp youtube_orig.apk youtube_modified.apk
          
          # ਜ਼ਿਪ ਕਮਾਂਡ ਰਾਹੀਂ ਅਸਲੀ ਏ.ਪੀ.ਕੇ ਦੇ ਅੰਦਰ ਫੋਟੋਆਂ ਅਪਡੇਟ ਕਰ ਦੇਣੀਆਂ
          cd zip_repack
          # ਜੇਕਰ ਰਿਸੋਰਸਿਜ਼ 'resources/res' ਪਾਥ ਵਿੱਚ ਸਨ
          if [ -d "resources" ]; then
            zip -ur "$BASE_DIR/youtube_modified.apk" resources/
          else
            # ਜੇਕਰ ਸਿੱਧੇ 'res' ਵਿੱਚ ਸਨ
            zip -ur "$BASE_DIR/youtube_modified.apk" res/
          fi
          cd "$BASE_DIR"
          
          rm -rf zip_repack jadx_out premium_dark_auto.png premium_light_auto.png
          echo "✅ MODIFIED APK ZIP REPACKING COMPLETED!"

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Zipalign & Sign Final JADX-Modded APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias youtube_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass "mysecretpassword" -keypass "mysecretpassword" -dname "CN=Diljan, OU=Dev, O=Mod, L=IN, S=PB, C=IN"
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 youtube_modified.apk youtube_aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:"mysecretpassword" --out youtube_premium_mod.apk youtube_aligned.apk

      - name: Upload Final Signed APK File
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Premium-Logo-APK
          path: youtube_premium_mod.apk
