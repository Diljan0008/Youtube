name: Automatic YouTube Premium Logo Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Reassemble Split APK Parts
        run: |
          cat apk_part_* > youtube_orig.apk
          rm -f apk_part_*

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Latest Apktool & Tools
        run: |
          mkdir -p ~/.local/bin
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O ~/.local/bin/apktool
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O ~/.local/bin/apktool.jar
          chmod +x ~/.local/bin/apktool ~/.local/bin/apktool.jar
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          sudo apt-get update && sudo apt-get install -y unzip zip

      - name: Extract APK via Unzip & Decompile via Apktool
        run: |
          # 1. ਪਹਿਲਾਂ ਐਰਰ ਤੋਂ ਬਚਣ ਲਈ -r ਨਾਲ ਨੋਰਮਲ ਡੀਕੰਪਾਈਲ ਕਰੋ
          apktool d -r youtube_orig.apk -o youtube_out
          
          # 2. ਫੋਟੋਆਂ ਕੱਢਣ ਲਈ ਏ.ਪੀ.ਕੇ ਨੂੰ ਸਿੱਧਾ ਅਨਜ਼ਿਪ ਕਰੋ (No XML Errors Possible!)
          mkdir -p apk_extracted
          unzip -q youtube_orig.apk -d apk_extracted
          
          # 3. ਅਨਜ਼ਿਪ ਕੀਤੀਆਂ ਅਸਲੀ ਫੋਟੋਆਂ ਨੂੰ youtube_out ਦੇ ਅੰਦਰ ਰਿਪਲੇਸ ਕਰਨ ਲਈ ਮੂਵ ਕਰੋ
          if [ -d "apk_extracted/res" ]; then
            cp -r apk_extracted/res/* youtube_out/res/
          elif [ -d "apk_extracted/resources/res" ]; then
            cp -r apk_extracted/resources/res/* youtube_out/resources/res/
          fi
          rm -rf apk_extracted

      - name: Auto Search and Swap All Logos
        run: |
          BASE_DIR=$(pwd)
          
          echo "========================================================="
          echo "🔍 STARTING AUTOMATIC SEARCH AND REPLACE"
          echo "========================================================="
          
          auto_find_and_replace() {
            local target_file=$1
            local source_premium=$2
            
            echo "🔎 Searching for: $target_file ..."
            
            find youtube_out -type f -name "$target_file" | while read -r file_path; do
              if [ -f "$file_path" ]; then
                rm -f "$file_path"
                cp "$BASE_DIR/$source_premium" "$file_path"
                echo "  ✅ AUTO-REPLACED: $file_path"
              fi
            done
          }
          
          # 1. ਪੁਰਾਣੇ ਟੈਕਸਟ ਵਾਲੇ ਲੋਗੋ
          auto_find_and_replace "yt_logo_text_dark.png" "yt_premium_logo_text_dark.png"
          auto_find_and_replace "yt_logo_text_light.png" "yt_premium_logo_text_light.png"
          
          # 2. ਨਵੇਂ PNG Wordmark Headers
          auto_find_and_replace "yt_wordmark_header_dark.png" "yt_premium_logo_text_dark.png"
          auto_find_and_replace "yt_wordmark_header_light.png" "yt_premium_logo_text_light.png"
          
          # 3. ਨਵੇਂ WEBP Ringo2 Wordmark Headers
          auto_find_and_replace "yt_ringo2_wordmark_header_dark.webp" "yt_premium_logo_text_dark.png"
          auto_find_and_replace "yt_ringo2_wordmark_header_light.webp" "yt_premium_logo_text_light.png"
          
          # 4. ਬਾਕੀ ਬਚੇ ਆਮ ਬੈਕਅੱਪ ਲੋਗੋ
          auto_find_and_replace "youtube_logo.webp" "yt_premium_logo_text_dark.png"
          auto_find_and_replace "ic_youtube_logo.png" "yt_premium_logo_text_dark.png"
          
          echo "========================================================="
          echo "🎉 AUTOMATIC SEARCH & SWAP FINISHED!"
          echo "========================================================="

      - name: Recompile Modified Code Into APK
        run: |
          apktool b youtube_out -o youtube_unsigned.apk

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Generate Keystore & Sign Final APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias youtube_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass "mysecretpassword" -keypass "mysecretpassword" -dname "CN=Diljan, OU=Dev, O=Mod, L=IN, S=PB, C=IN"
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 youtube_unsigned.apk youtube_aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:"mysecretpassword" --out youtube_premium_mod.apk youtube_aligned.apk

      - name: Upload Final Signed APK File
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Premium-Logo-APK
          path: youtube_premium_mod.apk
